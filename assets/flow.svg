<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="420" viewBox="0 0 1880 420" role="img" aria-labelledby="title desc">
  <title id="title">Antigravity Delegate workflow</title>
  <desc id="desc">You and your agent plan and review. The MCP delegate tool hands implementation to agy using Gemini models. agy edits your workspace and returns a clean result: what changed, which files, and the plan. Your agent reviews the diff.</desc>
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L18 9L0 18Z" fill="#8B949E"/>
    </marker>
    <style>
      text { font-family: 'DejaVu Sans Mono', monospace; font-weight: 400; fill: #8B949E; }
      .heading { font-size: 32px; }
      .body { font-size: 24px; }
      .label { font-size: 20px; }
    </style>
  </defs>
  <rect width="1880" height="420" fill="#0D1117"/>

  <rect x="70" y="60" width="380" height="190" rx="16" fill="#161B22" stroke="#FF6B6B" stroke-width="2.5"/>
  <text x="260" y="145" text-anchor="middle" class="heading" style="fill:#FF6B6B">You + your agent</text>
  <text x="260" y="188" text-anchor="middle" class="body">plans &amp; reviews</text>

  <text x="600" y="122" text-anchor="middle" class="label">MCP delegate tool</text>
  <path d="M485 155H714" fill="none" stroke="#8B949E" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="750" y="60" width="380" height="190" rx="16" fill="#161B22" stroke="#79C0FF" stroke-width="2.5"/>
  <text x="940" y="125" text-anchor="middle" class="heading" style="fill:#79C0FF">agy</text>
  <text x="940" y="167" text-anchor="middle" class="body">Gemini models</text>
  <text x="940" y="209" text-anchor="middle" class="body">implements</text>

  <text x="1280" y="122" text-anchor="middle" class="label">edits your workspace</text>
  <path d="M1165 155H1394" fill="none" stroke="#8B949E" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="1430" y="60" width="380" height="190" rx="16" fill="#161B22" stroke="#7EE787" stroke-width="2.5"/>
  <text x="1620" y="125" text-anchor="middle" class="heading" style="fill:#7EE787">Clean result</text>
  <text x="1620" y="167" text-anchor="middle" class="body">what changed,</text>
  <text x="1620" y="209" text-anchor="middle" class="body">which files, the plan</text>

  <path d="M1620 270V330H260V274" fill="none" stroke="#8B949E" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="940" y="369" text-anchor="middle" class="label">your agent reviews the diff</text>
</svg>
